name: Update Market Pulse

on:
  schedule:
    - cron: "7,27,47 * * * *"   # every 20 minutes (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild the year's history from Google News (slow, about 2 minutes)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-pulse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Fetch news and market data
        env:
          BACKFILL: ${{ inputs.backfill && '1' || '0' }}
        run: python scripts/update.py

      - name: Save history to the repo
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/history data/saved_meta.json
          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -q -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              sleep 5
            done
          fi

      - name: Build the site folder
        run: |
          mkdir -p _site
          cp -r index.html assets config.json data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
